name: Sync Juejin articles

on:
  workflow_dispatch:
  schedule:
    # Every 2 days at 02:00 UTC / 10:00 Asia/Shanghai
    - cron: '0 2 */2 * *'

permissions:
  contents: write

concurrency:
  group: sync-juejin
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync writing data
        run: bun run sync:writing

      - name: Commit and push
        run: |
          git config user.name "flycran"
          git config user.email "cffhidol@163.com"
          git add src/data/writing.ts
          if git diff --cached --quiet; then
            echo "No article changes"
            exit 0
          fi
          git commit -m "chore: sync Juejin articles"
          git push
